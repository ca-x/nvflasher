name: ci
on:
  push:
    tags:
      - 'v*'
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: go vet ./...
      - run: go test ./...
      - run: bun run typecheck

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
      - name: Linux build prerequisites
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: bun install --frozen-lockfile
      - run: bun run build -- -platform linux/${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: nvflasher-linux-${{ matrix.arch }}
          path: |
            build/linux-${{ matrix.arch }}/*.deb
            build/linux-${{ matrix.arch }}/*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: nvflasher-linux-*
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/*.deb release-assets/*.tar.gz --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/*.deb release-assets/*.tar.gz --verify-tag --generate-notes
          fi
